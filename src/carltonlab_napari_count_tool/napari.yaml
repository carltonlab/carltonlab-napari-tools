name: carltonlab-napari-count-tool
display_name: Carltonlab Count Tool
# use 'hidden' to remove plugin from napari hub search results
visibility: public
# see https://napari.org/stable/plugins/technical_references/manifest.html#fields for valid categories
# categories: []
contributions:
  commands:
    - id: carltonlab-napari-count-tool.make_container_widget
      python_name: carltonlab_napari_count_tool:ImageThreshold
      title: Make threshold Container widget
    - id: carltonlab-napari-count-tool.make_magic_widget
      python_name: carltonlab_napari_count_tool:threshold_magic_widget
      title: Make threshold magic widget
    - id: carltonlab-napari-count-tool.make_function_widget
      python_name: carltonlab_napari_count_tool:threshold_autogenerate_widget
      title: Make threshold function widget
    - id: carltonlab-napari-count-tool.make_qwidget
      python_name: carltonlab_napari_count_tool:ExampleQWidget
      title: Make example QWidget
  widgets:
    - command: carltonlab-napari-count-tool.make_container_widget
      display_name: Container Threshold
    - command: carltonlab-napari-count-tool.make_magic_widget
      display_name: Magic Threshold
    - command: carltonlab-napari-count-tool.make_function_widget
      autogenerate: true
      display_name: Autogenerate Threshold
    - command: carltonlab-napari-count-tool.make_qwidget
      display_name: Example QWidget
  menus:
    napari/layers/segment:
      - command: carltonlab-napari-count-tool.make_container_widget
      - command: carltonlab-napari-count-tool.make_magic_widget
      - command: carltonlab-napari-count-tool.make_function_widget
      - command: carltonlab-napari-count-tool.make_qwidget
